name: Launcher checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-14
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q unleash.py unleashlib tests
      - run: bash -n unleash-mac.sh tests/integration-linux.sh
      - run: git diff --check
      - name: Read-only platform smoke check
        run: |
          if [ "$(uname -s)" = Darwin ] && [ "$(uname -m)" != arm64 ]; then
            echo 'Native Mac smoke checks require Apple Silicon. Platform adapters were exercised by the unit suite.'
          else
            python unleash.py doctor
            python unleash.py plan --profile core
          fi
  linux-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:13-slim', 'fedora:44']
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify native packages in a disposable container
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo '${{ matrix.image }}' bash tests/integration-linux.sh
